user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Small bodies everywhere; only /admin/ may upload lab ZIPs (see site template).
    client_max_body_size 2m;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # The site (HTTP-only or HTTPS) is rendered from /etc/nginx/templates by the
    # nginx image's entrypoint (envsubst of ${SERVER_NAME}) into conf.d/.
    include /etc/nginx/conf.d/*.conf;
}
