{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<h1>Forgot Password</h1>
<p style="color:var(--muted)">Enter a username to check for reset instructions.</p>

<form method="POST" action="/lab2/forgot-password">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="off">
  <button type="submit">Check</button>
</form>

{% if message %}
<div class="panel" style="margin-top:16px;">
  <p>{{ message }}</p>
</div>
{% endif %}

<a class="btn secondary" href="/lab2/">Back to Lab 2</a>
{% endblock %}
