name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CTFplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: CTFplatform/requirements-core.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt pytest pip-audit
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Dependency vulnerability scan (non-blocking)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  cyberlab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CTFplatform/cyberlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
